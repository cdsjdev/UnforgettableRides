# Builds the rides-portal as a static, backend-free "show and tell" demo and
# publishes it to GitHub Pages at unforgettablerides.com.
#
# The demo runs with a mock data layer (VITE_STATIC_DEMO=true) — no server,
# no database. See rides-portal/src/services/mockAdapter.ts.
#
# Trigger: push to the `static-demo` branch (or run manually).
name: Deploy static demo

on:
  push:
    branches: [static-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rides-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build static demo
        run: npm run build:demo
        env:
          VITE_STATIC_DEMO: "true"

      - name: Add SPA fallback + custom domain
        run: |
          cp dist/index.html dist/404.html
          cp demo-static/CNAME dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rides-portal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
